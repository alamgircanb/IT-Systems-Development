<div class="page-container">
  <h2>Customers</h2>
  <p>
   Search and browse customers from Wide World Importers.
  </p>
<!-- #searchInput refers to this input; the input event writes its value to the searchTerm signal. -->
<input #searchInput
  type="text"
  class="search-bar"
  placeholder="Search customers..."
  [value]="searchTerm()"
  (input)="searchTerm.set(searchInput.value)"/>
<!-- The filteredCustomers() signal returns the list of customers that match the search term. -->
  <ul class="card-list">
    @for (customer of filteredCustomers(); track customer.CustomerID) {
      <li class="card">
        <h3>{{ customer.CustomerName }}</h3>
        <p><strong>City:</strong> {{ customer.City }}</p>
        <p><strong>Phone:</strong> {{ customer.PhoneNumber }}</p>
      </li>
    }
  </ul>
</div>
