<!-- Main container for the Orders page -->
<div class="page-container">
  <h2>Orders</h2>

  <!--
    #searchInput creates a template reference to this input element.
    [value] reads the current value from the searchTerm signal.
    (input) updates the signal whenever the user types.
  -->
  <input
    #searchInput
    type="text"
    placeholder="Search orders by ID or customer..."
    [value]="searchTerm()"
    (input)="searchTerm.set(searchInput.value)"
    class="search-bar"
  />

  <!-- Displays the orders returned by filteredOrders() -->
  <ul class="card-list">

    <!--
      @for repeats the <li> element for every filtered order.
      track order.OrderID helps Angular identify each order efficiently.
    -->
    @for (order of filteredOrders(); track order.OrderID) {
      <li class="card">

        <!-- Interpolation displays properties from the current order object -->
        <h3>Order #{{ order.OrderID }}</h3>
        <p><strong>Date:</strong> {{ order.OrderDate }}</p>
        <p><strong>Customer:</strong> {{ order.CustomerName }}</p>
        <p><strong>Total:</strong> ${{ order.TotalAmount }}</p>
      </li>
    }
  </ul>
</div>
